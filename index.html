<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>PGA Group EV — Live Board</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e8eaed; --muted:#9aa3b2;
    --value:#37d67a; --value-bg:#12351f; --lean:#f0b429; --lean-bg:#332608;
    --long:#7b8496; --pos:#37d67a; --neg:#ff6b6b; --accent:#5b9dff;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f6f8; --card:#ffffff; --line:#e3e6eb; --fg:#1a1d23; --muted:#5b6270;
      --value:#0f9d58; --value-bg:#e3f6ea; --lean:#a9760a; --lean-bg:#fbf1d8;
      --long:#8a92a0; --pos:#0f9d58; --neg:#d1372f; --accent:#2f6fe0;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  header{position:sticky; top:0; background:var(--bg); padding:14px 2px 10px; z-index:5;
    border-bottom:1px solid var(--line); margin-bottom:14px;}
  h1{font-size:17px; margin:0 0 2px; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:12.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--value); display:inline-block;
    box-shadow:0 0 0 0 rgba(55,214,122,.5); animation:pulse 2s infinite}
  .dot.stale{background:var(--lean); animation:none}
  .dot.old{background:var(--neg); animation:none}
  #updated.stale{color:var(--lean)} #updated.old{color:var(--neg)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,214,122,.45)}70%{box-shadow:0 0 0 7px rgba(55,214,122,0)}100%{box-shadow:0 0 0 0 rgba(55,214,122,0)}}
  .cut{color:var(--muted); font-size:12.5px}
  .cut.moved{color:var(--lean); font-weight:600}
  h2{font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted);
    margin:20px 2px 8px; font-weight:700}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:9px; display:flex; align-items:center; gap:10px}
  .card.value{border-left:3px solid var(--value)}
  .card.lean{border-left:3px solid var(--lean)}
  .grp{flex:0 0 26px; height:26px; border-radius:7px; background:var(--line); color:var(--fg);
    font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center}
  .who{flex:1 1 auto; min-width:0}
  .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .meta{color:var(--muted); font-size:12.5px; margin-top:2px}
  .bubble{color:var(--lean); font-weight:600}
  .nums{flex:0 0 auto; text-align:right}
  .odds{font-weight:700; font-variant-numeric:tabular-nums; font-size:15px}
  .ev{font-size:12.5px; font-variant-numeric:tabular-nums; margin-top:2px}
  .ev.pos{color:var(--pos)} .ev.neg{color:var(--neg)}
  .longs{color:var(--muted); font-size:13px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 13px}
  .empty{color:var(--muted); font-size:14px; padding:8px 2px}
  footer{color:var(--muted); font-size:11.5px; text-align:center; margin-top:22px; line-height:1.5}
  .err{color:var(--neg); font-size:13px; padding:10px 2px}
</style>
</head>
<body>
<header>
  <h1 id="event">PGA Group EV — Live Board</h1>
  <div class="sub">
    <span class="dot" id="dot"></span>
    <span id="updated">loading…</span>
    <span class="cut" id="cut"></span>
  </div>
</header>

<main id="board"><div class="empty">Loading the latest board…</div></main>

<footer>
  Auto-refreshes every 30s · Datagolf finish model vs FanDuel group-winner odds<br>
  A flagged edge is a prompt to look, not an auto-bet — confirm the price before you bet.
</footer>

<script>
const REFRESH_MS = 30000;
let lastEpoch = null, lastAbs = '';        // set on each successful fetch

function amOdds(n){ n = Math.round(n); return (n>0?"+":"") + n; }

function fmtAgo(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 10) return 'just now';
  if(sec < 60) return sec + 's ago';
  const m = Math.floor(sec/60), s = sec%60;
  if(m < 60) return s ? `${m}m ${s}s ago` : `${m}m ago`;
  const h = Math.floor(m/60);
  return `${h}h ${m%60}m ago`;
}

// Tick the relative time every second, and color it by staleness so you can see
// at a glance how far behind the data is: green < 4 min, amber 4-8, red > 8.
function tick(){
  const up = document.getElementById('updated'), dot = document.getElementById('dot');
  if(lastEpoch == null){ up.textContent = 'loading…'; return; }
  const age = Date.now()/1000 - lastEpoch;
  up.textContent = 'updated ' + fmtAgo(age);
  up.title = lastAbs;                        // absolute time on hover
  const cls = age < 240 ? '' : age < 480 ? 'stale' : 'old';
  up.className = cls; dot.className = 'dot ' + cls;
}
setInterval(tick, 1000);

function card(r, cls){
  const ev = (r.ev_pct>=0?"pos":"neg");
  const bubble = r.bubble ? ' · <span class="bubble">bubble</span>' : '';
  const mc = (r.make_cut_pct!=null && r.make_cut_pct<100)
      ? ` · MC ${r.make_cut_pct.toFixed(0)}%` : '';
  return `<div class="card ${cls}">
    <div class="grp">${r.group}</div>
    <div class="who">
      <div class="name">${r.player}</div>
      <div class="meta">DG ${r.dg_win_pct.toFixed(1)}%${mc}${bubble}</div>
    </div>
    <div class="nums">
      <div class="odds">${amOdds(r.odds)}</div>
      <div class="ev ${ev}">EV ${r.ev_pct>=0?"+":""}${r.ev_pct.toFixed(1)}%</div>
    </div>
  </div>`;
}

function render(d){
  document.getElementById('event').textContent = (d.event || 'PGA') + ' — Live Board';
  lastEpoch = (typeof d.generated_epoch === 'number') ? d.generated_epoch : null;
  lastAbs = d.updated || '';
  tick();                                    // refresh the relative time immediately
  const cutEl = document.getElementById('cut');
  if(d.cut && d.cut.level!=null){
    cutEl.textContent = '· Cut ' + d.cut.level + (d.cut.moved ? ' (moved)' : '');
    cutEl.className = 'cut' + (d.cut.moved ? ' moved' : '');
  } else cutEl.textContent = '';

  const rows = d.rows || [];
  const value = rows.filter(r=>r.tier==='VALUE').sort((a,b)=>b.ev_pct-a.ev_pct);
  const leans = rows.filter(r=>r.tier==='LEAN').sort((a,b)=>(b.edge_pts||0)-(a.edge_pts||0));
  const longs = rows.filter(r=>r.tier==='LONGSHOT');

  let html = '';
  html += '<h2>Bettable value' + (value.length?` (${value.length})`:'') + '</h2>';
  html += value.length ? value.map(r=>card(r,'value')).join('')
                       : '<div class="empty">No bettable value on this board.</div>';
  if(leans.length){
    html += '<h2>Leans — bet only if the price lengthens</h2>';
    html += leans.map(r=>card(r,'lean')).join('');
  }
  if(longs.length){
    html += '<h2>Longshots filtered (below win% floor)</h2>';
    html += '<div class="longs">' +
      longs.map(r=>`${r.player} (${r.dg_win_pct.toFixed(1)}%)`).join(' · ') + '</div>';
  }
  document.getElementById('board').innerHTML = html;
}

async function load(){
  try{
    const res = await fetch('board.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  }catch(e){
    // Keep showing the last board + its (now growing) relative age, so a fetch
    // blip doesn't blank the screen; tick() will color it stale/old on its own.
    if(!document.querySelector('.card')){
      document.getElementById('board').innerHTML =
        '<div class="err">Waiting for the first board to publish…</div>';
    }
  }
}
load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
